<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F4CF67;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="navyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050D1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0B192C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="250" fill="url(#navyGradient)" stroke="url(#goldGradient)" stroke-width="8"/>
  
  <!-- Shield Shape -->
  <path d="M 256 80 L 380 140 L 380 280 Q 380 380 256 432 Q 132 380 132 280 L 132 140 Z" 
        fill="none" stroke="url(#goldGradient)" stroke-width="6" opacity="0.8"/>
  
  <!-- Leaf -->
  <path d="M 256 180 Q 320 220 320 300 Q 320 360 256 380 Q 192 360 192 300 Q 192 220 256 180 Z" 
        fill="#2E7D32" opacity="0.9"/>
  
  <!-- Leaf Vein -->
  <path d="M 256 180 L 256 380" stroke="#1B5E20" stroke-width="3" opacity="0.6"/>
  <path d="M 256 240 Q 280 260 290 280" stroke="#1B5E20" stroke-width="2" opacity="0.5" fill="none"/>
  <path d="M 256 280 Q 232 300 222 320" stroke="#1B5E20" stroke-width="2" opacity="0.5" fill="none"/>
  
  <!-- Digital Elements -->
  <circle cx="200" cy="150" r="4" fill="#D4AF37" opacity="0.7"/>
  <circle cx="312" cy="150" r="4" fill="#D4AF37" opacity="0.7"/>
  <circle cx="200" cy="362" r="4" fill="#D4AF37" opacity="0.7"/>
  <circle cx="312" cy="362" r="4" fill="#D4AF37" opacity="0.7"/>
  
  <!-- Glow Effect -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.3"/>
</svg>
